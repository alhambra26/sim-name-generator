<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sims Name Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Sims Name Generator</h1>

    <p>Generador de nombres para Los Sims</p>

    <h2>¿Qué quieres generar?</h2>

    <label>
        <input type="radio" name="tipo" value="nombre" checked>
        Nombre
    </label>

    <label>
        <input type="radio" name="tipo" value="apellido">
        Apellido
    </label>

    <label>
        <input type="radio" name="tipo" value="completo">
        Nombre + apellido
    </label>

    <h2>Género</h2>

    <label>
        <input type="radio" name="genero" value="femenino">
        Femenino
    </label>

    <label>
        <input type="radio" name="genero" value="masculino">
        Masculino
    </label>

    <label>
        <input type="radio" name="genero" value="ambos" checked>
        Ambos
    </label>
<h2>Cantera</h2>

<select id="cantera">
    <option value="todas">Todas las canteras</option>
    <option value="mitologia">Mitología y Religión</option>
    <option value="historia">Historia y Nobleza</option>
    <option value="civilizaciones">Civilizaciones y Arqueología</option>
    <option value="literatura">Literatura y Leyendas</option>
    <option value="arte">Arte y Arquitectura</option>
    <option value="musica">Música y Artes Escénicas</option>
    <option value="cine">Cine, TV y Cultura Popular</option>
    <option value="fantasia">Fantasía y Universos Imaginarios</option>
    <option value="geografia">Geografía y Exploración</option>
    <option value="ciencia">Ciencia, Astronomía y Matemáticas</option>
    <option value="lenguas">Lenguas y Escrituras</option>
    <option value="naturaleza">Naturaleza, Fauna y Geología</option>
    <option value="esoterismo">Esoterismo y Simbolismo</option>
    <option value="sociedad">Sociedad, Oficios y Vida Cotidiana</option>
    <option value="conceptos">Conceptos</option>
</select>
    <br><br>

    <button onclick="generarNombre()">Generar</button>

    <h2 id="resultado"></h2>

    <script src="names.js"></script>
    <script src="script.js"></script>

</body>
</html>
